[package]
name = "microclaw-clawhub"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zip = "8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1.23.1", features = ["v4"] }
